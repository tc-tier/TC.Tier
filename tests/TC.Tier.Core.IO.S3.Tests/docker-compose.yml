version: "3.8"

# MinIO 测试栈（§7.4 验证基础设施矩阵——免费层主战场）
# 用法：scripts/run-minio-tests.sh 自动起停；手工调试可 docker compose up -d
services:
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z   # 版本钉死（RELEASE tag——可复现）
    container_name: tier-s3-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:19000:9000"   # 仅回环——测试端点不暴露
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
