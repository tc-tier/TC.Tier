name: oss-sync

# 公开库代码同步（用户裁定 2026-08-25：tag = 发布开关，全自动）：
# 打 tag（v* / runtime-v*）→ 过滤同步到公开库 tc-tier/TC.Tier → 自动 PR → CI 绿后自动合并。
# 与 publish.yml（NuGet）同触发——打一个 tag，发布全链路完成。
# workflow_dispatch 供手动补同步（如公开库落后时）。

on:
  push:
    tags: ['v*', 'runtime-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync to public repo (tc-tier/TC.Tier)
        env:
          GH_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
          TCTIER_CI: "1"
          TCTIER_PUB_URL: https://x-access-token:${{ secrets.GH_PAGES_TOKEN }}@github.com/tc-tier/TC.Tier.git
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAGES_TOKEN 未配置，跳过公开同步（配置方法见 docs/documentation-site-navigation.md）"
            exit 0
          fi
          bash scripts/oss-sync.sh "sync: ${GITHUB_REF_NAME} 发布同步（自动）"
