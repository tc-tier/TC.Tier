name: Publish

# ★ 发布主体 = 公开库 tc-tier/TC.Tier（2026-08-28 设计决策：NuGet 由公开库发布）：
#   内部库打 tag → oss-sync 同步源码 → 公开库 PR auto-merge → 同号 tag 传递到公开库 main
#   → 本 workflow 由公开库 tag push 触发——NuGet 包 ↔ 公开源码/tag/CI run 全链公开可审计。
#   ★ repository guard：内部库同名 tag push 触发时 build 直接 skip，publish 级联 skip——
#     NUGET_USER secret 只配在公开库，内部库不持有 NuGet 发布凭据（凭据最小化）。

on:
  push:
    tags: ['v*', 'runtime-v*', 'preview-v*']

jobs:
  build:
    if: github.repository == 'tc-tier/TC.Tier'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # ★ 全量 build+test 仅正式线（v* / runtime-v*）；preview 线免门禁——预览即打包即发，
      #   多库消费迭代不等 CI（质量门禁由 dev/main 的 CI 矩阵与正式线发布承担）
      - name: Build and test (formal lanes only)
        if: ${{ !startsWith(github.ref_name, 'preview-v') }}
        shell: bash
        run: |
          set -e
          dotnet build -c Release --nologo
          # ★ 时序敏感套件重试 ×2（吸收 runner 噪音——与 ci.yml 惯例对齐；#424 台账指出
          #   正式门禁无重试 = 单次即红，逐项根修在案，重试只吸收环境抖动不豁免红）
          run_with_retry() {
            for attempt in 1 2; do
              if "$@"; then return 0; fi
              echo "== $* 第 $attempt 次失败（runner 时段性慢）——重试 =="
            done
            return 1
          }
          run_with_retry dotnet test tests/TC.Tier.Core.Tests/TC.Tier.Core.Tests.csproj -c Release --no-build --nologo
          run_with_retry dotnet test tests/TC.Tier.Runtime.Tests/TC.Tier.Runtime.Tests.csproj -c Release --no-build --nologo
          run_with_retry dotnet test tests/TC.Tier.Products.Tests/TC.Tier.Products.Tests.csproj -c Release --no-build --nologo
          run_with_retry dotnet test tests/TC.Tier.Core.Net.Tests/TC.Tier.Core.Net.Tests.csproj -c Release --no-build --nologo
          run_with_retry dotnet test tests/TC.Tier.Core.IO.Net.Tests/NetworkImageTransferTests.csproj -c Release --no-build --nologo

      # ★ Tag 分流：v1.0.0 → 四正式包；runtime-v0.0.1-beta → Runtime beta + 同版本 Core；
      #   preview-v1.0.0-alpha.N → Products 家族/网络扩展首发预览（未经网关实战打磨前不走正式通道，
      #   A.1~A.5 全量迁移 + 零中间件稳定一个周期后并入 v* 正式线——与 TC.Traffic Track C 同一把尺子）。
      #   beta 线必须连带 pack Core：Runtime 对 Core 是 ProjectReference → nuspec 包依赖
      #   （非打平进 Runtime 包），只发 Runtime 则依赖在 NuGet.org 解析不到（死包）。
      - name: Pack (v* = Contracts/Core/CodeGen official)
        if: startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'runtime-v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          dotnet pack src/TC.Tier.Contracts/TC.Tier.Contracts.csproj -c Release --no-build --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.Core/TC.Tier.Core.csproj -c Release --no-build --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.CodeGen/TC.Tier.CodeGen.csproj -c Release --no-build --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.Analyzers/TC.Tier.Analyzers.csproj -c Release --no-build --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.CodeGen.Analyzers/TC.Tier.CodeGen.Analyzers.csproj -c Release --no-build --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.Core.IO.S3/TC.Tier.Core.IO.S3.csproj -c Release --no-build --nologo -o artifacts -p:Version=$VERSION

      - name: Pack (runtime-v* = Runtime beta + Core dependency)
        if: startsWith(github.ref_name, 'runtime-v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#runtime-v}
          dotnet pack src/TC.Tier.Core/TC.Tier.Core.csproj -c Release --no-build --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.Runtime/TC.Tier.Runtime.csproj -c Release --no-build --nologo -o artifacts -p:Version=$VERSION

      # ★ preview-v* = 全家族预览（2026-09-16 扩展——TC.Traffic 消费需要全套可解析依赖；
      #   同版本号一次发齐 12 包=src 全部项目，包间 nuspec 依赖精确互指）。Runtime 同号入
      #   预览线（runtime-v* 0.0.x-beta 通道保留不变——两线均为 prerelease，互不冲突）。
      # ★ preview 线 pack 不带 --no-build——该线无前置 build 步（免门禁），pack 自带 restore+build
      - name: Pack (preview-v* = full family preview)
        if: startsWith(github.ref_name, 'preview-v')
        shell: bash
        run: |
          set -e
          VERSION=${GITHUB_REF_NAME#preview-v}
          dotnet pack src/TC.Tier.Contracts/TC.Tier.Contracts.csproj -c Release --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.Core/TC.Tier.Core.csproj -c Release --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.Runtime/TC.Tier.Runtime.csproj -c Release --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.CodeGen/TC.Tier.CodeGen.csproj -c Release --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.CodeGen.Abstractions/TC.Tier.CodeGen.Abstractions.csproj -c Release --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.Analyzers/TC.Tier.Analyzers.csproj -c Release --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.CodeGen.Analyzers/TC.Tier.CodeGen.Analyzers.csproj -c Release --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.Core.IO.S3/TC.Tier.Core.IO.S3.csproj -c Release --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.Core.IO.Net/TC.Tier.Core.IO.Net.csproj -c Release --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.Core.Net/TC.Tier.Core.Net.csproj -c Release --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.Products/TC.Tier.Products.csproj -c Release --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.Products.Net/TC.Tier.Products.Net.csproj -c Release --nologo -o artifacts -p:Version=$VERSION

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  # ★ 独立 publish job：fresh OIDC token（build+test+pack 超 5 分钟会过期——split job 是标准做法）
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x   # trusted publishing OIDC 需 SDK 9.0.2xx+（系统 dotnet 不支持）

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      # ★ Trusted publishing 标准流程：OIDC token → NuGet/login 交换短期 API key（1h）→ push
      #   （nuget.org 侧 trusted publishing 登记的 repo 必须是 tc-tier/TC.Tier）
      - name: NuGet login (OIDC to temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
