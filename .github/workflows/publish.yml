name: Publish

# ★ 发布主体 = 公开库 tc-tier/TC.Tier（2026-08-28 设计决策：NuGet 由公开库发布）：
#   内部库打 tag → oss-sync 同步源码 → 公开库 PR auto-merge → 同号 tag 传递到公开库 main
#   → 本 workflow 由公开库 tag push 触发——NuGet 包 ↔ 公开源码/tag/CI run 全链公开可审计。
#   ★ repository guard：内部库同名 tag push 触发时 build 直接 skip，publish 级联 skip——
#     NUGET_USER secret 只配在公开库，内部库不持有 NuGet 发布凭据（凭据最小化）。

on:
  push:
    tags: ['v*', 'runtime-v*']

jobs:
  build:
    if: github.repository == 'tc-tier/TC.Tier'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build and test
        run: |
          dotnet build -c Release --nologo
          dotnet test tests/TC.Tier.Core.Tests/TC.Tier.Core.Tests.csproj -c Release --no-build --nologo
          dotnet test tests/TC.Tier.Runtime.Tests/TC.Tier.Runtime.Tests.csproj -c Release --no-build --nologo

      # ★ Tag 分流：v1.0.0 → 四正式包；runtime-v0.0.1-beta → Runtime beta + 同版本 Core。
      #   beta 线必须连带 pack Core：Runtime 对 Core 是 ProjectReference → nuspec 包依赖
      #   （非打平进 Runtime 包），只发 Runtime 则依赖在 NuGet.org 解析不到（死包）。
      - name: Pack (v* = Contracts/Core/CodeGen official)
        if: startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'runtime-v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          dotnet pack src/TC.Tier.Contracts/TC.Tier.Contracts.csproj -c Release --no-build --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.Core/TC.Tier.Core.csproj -c Release --no-build --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.CodeGen/TC.Tier.CodeGen.csproj -c Release --no-build --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.Core.IO.S3/TC.Tier.Core.IO.S3.csproj -c Release --no-build --nologo -o artifacts -p:Version=$VERSION

      - name: Pack (runtime-v* = Runtime beta + Core dependency)
        if: startsWith(github.ref_name, 'runtime-v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#runtime-v}
          dotnet pack src/TC.Tier.Core/TC.Tier.Core.csproj -c Release --no-build --nologo -o artifacts -p:Version=$VERSION
          dotnet pack src/TC.Tier.Runtime/TC.Tier.Runtime.csproj -c Release --no-build --nologo -o artifacts -p:Version=$VERSION

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

  # ★ 独立 publish job：fresh OIDC token（build+test+pack 超 5 分钟会过期——split job 是标准做法）
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x   # trusted publishing OIDC 需 SDK 9.0.2xx+（系统 dotnet 不支持）

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      # ★ Trusted publishing 标准流程：OIDC token → NuGet/login 交换短期 API key（1h）→ push
      #   （nuget.org 侧 trusted publishing 登记的 repo 必须是 tc-tier/TC.Tier）
      - name: NuGet login (OIDC to temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
