name: docs-deploy

# 文档站全自动发布（用户裁定 2026-08-25）：
# push main（文档相关路径）→ Release 构建 + docfx build → 双通道：
#   ① 推 _site 到公开仓库 tc-tier/TC.Tier 的 gh-pages 分支 → GitHub Pages
#   ② rsync 到自有服务器（deploy-docs 低权限账户 + rrsync）→ docs.mytzz.top
# 手动兜底：bash scripts/docs-deploy.sh（旧流程保留）

on:
  push:
    branches: [main]
    paths:
      - 'src/**/docs/**'
      - 'src/*/COORDINATION.md'
      - 'docs-site/**'
      - 'README.md'
      - 'README.en.md'
      - 'CONTRIBUTING.md'
      - 'toc.yml'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Release build (XML doc metadata)
        run: dotnet build src/TC.Tier.Runtime/TC.Tier.Runtime.csproj -c Release --nologo -v q

      - name: DocFX metadata (API reference)
        working-directory: docs-site
        run: docfx metadata docfx.json

      - name: DocFX build (site)
        working-directory: docs-site
        run: docfx build docfx.json

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs-site/_site
          retention-days: 7

  github-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: Push to public repo gh-pages branch
        env:
          GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
        run: |
          if [ -z "$GH_PAGES_TOKEN" ]; then
            echo "GH_PAGES_TOKEN 未配置，跳过 Pages 通道（配置方法见 docs/documentation-site-navigation.md）"
            exit 0
          fi
          git config --global user.name "docs-bot"
          git config --global user.email "docs-bot@users.noreply.github.com"
          git clone --depth 1 --branch gh-pages https://x-access-token:${GH_PAGES_TOKEN}@github.com/tc-tier/TC.Tier.git gh-pages-repo \
            || { git init gh-pages-repo && cd gh-pages-repo && git checkout -b gh-pages; cd ..; }
          cd gh-pages-repo
          git rm -rf --quiet --ignore-unmatch .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../site/. ./
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过"
          else
            git commit -m "docs: 站点自动发布（$(date +%F)）"
            git push origin gh-pages
          fi

  server:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: Rsync to docs.mytzz.top (deploy-docs 低权限账户)
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_DEPLOY_KEY" > ~/.ssh/docs_deploy_key
          chmod 600 ~/.ssh/docs_deploy_key
          ssh-keyscan -p ${SERVER_PORT} ${SERVER_HOST} >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -i ~/.ssh/docs_deploy_key -p ${SERVER_PORT} -o StrictHostKeyChecking=yes" \
            site/ ${SERVER_USER}@${SERVER_HOST}:.
